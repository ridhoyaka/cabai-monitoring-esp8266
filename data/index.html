<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cabai - IoT Dashboard</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Status Bar -->
        <div class="status-bar" id="timeDisplay">09:41</div>

        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <span class="icon"></span>
                Monitoring cabai
            </div>
            <div class="header-subtitle">
                <span class="status-dot"></span>
                ESP8266 - terhubung
            </div>
        </div>

        <!-- Sensor Cards -->
        <div class="sensor-cards">
            <!-- Sensor Cahaya (Soft Gold) -->
            <div class="sensor-card">
                <div class="sensor-info">
                    <div class="sensor-icon" style="background: #FFF176;"></div>
                    <div class="sensor-name">Cahaya</div>
                    <div class="sensor-type">BH1750</div>
                </div>
                <div class="sensor-value-container">
                    <span class="sensor-value" id="luxValue">25000</span>
                    <span class="sensor-unit">lux</span>
                </div>
            </div>

            <!-- Sensor Suhu (Coral Orange) -->
            <div class="sensor-card">
                <div class="sensor-info">
                    <div class="sensor-icon" style="background: #FF8A65;"></div>
                    <div class="sensor-name">Suhu</div>
                    <div class="sensor-type">DHT22</div>
                </div>
                <div class="sensor-value-container">
                    <span class="sensor-value" id="suhuValue">27.5</span>
                    <span class="sensor-unit">°C</span>
                </div>
            </div>

            <!-- Sensor Kelembapan (Sky Blue) -->
            <div class="sensor-card">
                <div class="sensor-info">
                    <div class="sensor-icon" style="background: #29B6F6;"></div>
                    <div class="sensor-name">Kelembapan</div>
                    <div class="sensor-type">DHT22</div>
                </div>
                <div class="sensor-value-container">
                    <span class="sensor-value" id="humValue">70</span>
                    <span class="sensor-unit">%</span>
                </div>
            </div>
        </div>

        <!-- Status Decision Tree Card -->
        <div class="status-card aman" id="statusCard">
            <div class="status-icon-box"></div>
            <div class="status-text">
                <div class="status-title" id="statusTitle">Optimal</div>
                <div class="status-subtitle">Hasil Decision Tree</div>
            </div>
        </div>

        <!-- Chart Card dengan Tab Switcher -->
        <div class="chart-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div class="chart-title" style="margin-bottom: 0;">Rincian Data Sensor</div>
                <div style="font-size: 11px; color: #666;">Live (2s)</div>
            </div>
            
            <!-- Tab Buttons -->
            <div class="chart-tabs">
                <button class="tab-btn active" onclick="switchTab('suhu', this)">Suhu</button>
                <button class="tab-btn" onclick="switchTab('hum', this)">Kelembapan</button>
                <button class="tab-btn" onclick="switchTab('lux', this)">Cahaya</button>
            </div>
            
            <div class="chart-container">
                <canvas id="dynamicChart"></canvas>
            </div>
            
            <!-- Custom Legend -->
            <div style="display: flex; gap: 15px; margin-top: 15px; font-size: 10px; color: #666; justify-content: center;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <div style="width: 15px; height: 2px; background: #3B82F6;"></div>
                    <span>Data Aktual</span>
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <div style="width: 15px; height: 2px; border-top: 2px dashed #EF4444;"></div>
                    <span>Batas Atas</span>
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <div style="width: 15px; height: 2px; border-top: 2px dashed #F59E0B;"></div>
                    <span>Batas Bawah</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/decision-tree.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
